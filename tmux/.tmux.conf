# ═══════════════════════════════════════════════════════════════════════
#  tmux — one muted violet accent, everything else terminal default
# ═══════════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────────── palette ────
# accent  #8b7bb8  muted violet: active window, active pane border, session name
# dim     #5a5a5a  neutral grey: inactive pane borders, activity dot
# everything else inherits the terminal's own colours

# ─────────────────────────────────────────────────────────────── glyphs ────
# Nerd Font private-use codepoints; tmux expands these verbatim.
set -g @dot "•"

# ───────────────────────────────────────────────────────── program icons ───
set -g @i-nvim     ""
set -g @i-vim      ""
set -g @i-shell    ""
set -g @i-git      ""
set -g @i-docker   ""
set -g @i-python   ""
set -g @i-node     ""
set -g @i-opencode ""
set -g @i-fallback ""

# Icon for a window, picked from the command running in its active pane.
# NOTE: no "$" anywhere in these patterns — tmux's parser eats it as an
# env var reference. Prefix anchors are enough for command names.

# ───────────────────────────────────────────────────────────── terminal ────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g renumber-windows on
set -g display-time 3000
set -g status-interval 5
set -g destroy-unattached off
set -g allow-passthrough on
set -g default-shell "$SHELL"

# ──────────────────────────────────────────────────────────── status bar ───
set -g status-position top
set -g status on
set -g status-style "default"
set -g status-justify centre
set -g status-left-length 40
set -g status-right-length 20

# left rail: session name, no decoration
set -g status-left "#[fg=#8b7bb8]#{session_name} "

# right rail: zoom flag only
set -g status-right "#[fg=#8b7bb8]#{?window_zoomed_flag, ZOOM ,}"

# window list, centred
set -g window-status-separator " "
set -g window-status-format "#[fg=default]#{?#{m/r:^(nvim|nvim-q|nvim-remote),#{pane_current_command}},#{@i-nvim},#{?#{m/r:^(vim|vi),#{pane_current_command}},#{@i-vim},#{?#{m/r:^(zsh|bash|fish|ksh),#{pane_current_command}},#{@i-shell},#{?#{m/r:^(git|lazygit),#{pane_current_command}},#{@i-git},#{?#{m/r:^docker,#{pane_current_command}},#{@i-docker},#{?#{m/r:^python,#{pane_current_command}},#{@i-python},#{?#{m/r:^node,#{pane_current_command}},#{@i-node},#{?#{m/r:^opencode,#{pane_current_command}},#{@i-opencode},#{@i-fallback}}}}}}}}} #{window_index}:#{window_name}#[fg=#5a5a5a]#{?window_activity_flag,•,}"
set -g window-status-current-format "#[fg=#8b7bb8,bold]#{?#{m/r:^(nvim|nvim-q|nvim-remote),#{pane_current_command}},#{@i-nvim},#{?#{m/r:^(vim|vi),#{pane_current_command}},#{@i-vim},#{?#{m/r:^(zsh|bash|fish|ksh),#{pane_current_command}},#{@i-shell},#{?#{m/r:^(git|lazygit),#{pane_current_command}},#{@i-git},#{?#{m/r:^docker,#{pane_current_command}},#{@i-docker},#{?#{m/r:^python,#{pane_current_command}},#{@i-python},#{?#{m/r:^node,#{pane_current_command}},#{@i-node},#{?#{m/r:^opencode,#{pane_current_command}},#{@i-opencode},#{@i-fallback}}}}}}}}} #{window_index}:#{window_name}"

# ─────────────────────────────────────────────────────────── pane borders ───
set -g pane-border-style "fg=#5a5a5a"
set -g pane-active-border-style "fg=#8b7bb8"
set -g pane-border-status top
set -g pane-border-format "#[fg=#{?pane_active,#8b7bb8,#5a5a5a},bg=default] #{pane_index} "

# ──────────────────────────────────────────────────────────── copy mode ─────
set -g mode-keys vi
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi w send -X copy-selection-and-cancel
bind -T copy-mode-vi C-y send -X copy-pipe-and-cancel "pbcopy"

# ────────────────────────────────────────────────────────── pane movement ───
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ──────────────────────────────────────────────────────────────── splits ────
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# ──────────────────────────────────────────────────────────────── windows ────
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind Space next-layout
bind z resize-pane -Z
bind q display-panes
bind w choose-window
bind s choose-tree
bind [ swap-pane -U
bind ] swap-pane -D
bind ! break-pane
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #I? (y/n)" kill-window

# ───────────────────────────────────────────────────────────────── misc ────
bind r source-file ~/.tmux.conf \; display "tmux reloaded"
bind m set -g mouse \; display "mouse on"
bind M set -g mouse off \; display "mouse off"

# ─────────────────────────────────────────────────────────────── plugins ────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'
