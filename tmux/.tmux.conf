# ═══════════════════════════════════════════════════════════════════════
#  Iris — violet glass rail for tmux
#  Palette mirrors ~/.config/sketchybar/sketchybarrc
# ═══════════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────────── palette ────
set -g @iris-bg     "#14101c"
set -g @iris-fg     "#cbb6ff"
set -g @iris-icon   "#9a80d0"
set -g @iris-dim    "#6a5b8f"
set -g @iris-accent "#a98bff"
set -g @iris-warn   "#e6a94d"
set -g @iris-line   "#2a2140"

# ─────────────────────────────────────────────────────────────── glyphs ────
# Nerd Font private-use codepoints; tmux expands these verbatim.
set -g @iris-tip-r ""
set -g @iris-tip-l ""
set -g @iris-rule  "│"
set -g @iris-dot   "•"

# ───────────────────────────────────────────────────────── program icons ───
set -g @iris-i-nvim     ""
set -g @iris-i-vim      ""
set -g @iris-i-shell    ""
set -g @iris-i-git      ""
set -g @iris-i-docker   ""
set -g @iris-i-python   ""
set -g @iris-i-node     ""
set -g @iris-i-opencode ""
set -g @iris-i-fallback ""

# Icon for a window, picked from the command running in its active pane.
# NOTE: no "$" anywhere in these patterns — tmux's parser eats it as an
# env var reference. Prefix anchors are enough for command names.

# ───────────────────────────────────────────────────────────── terminal ────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g renumber-windows on
set -g display-time 3000
set -g status-interval 5
set -g destroy-unattached off
set -g allow-passthrough on
set -g default-shell "$SHELL"

# ──────────────────────────────────────────────────────────── status bar ───
set -g status-position top
set -g status on
set -g status-style "bg=#14101c,fg=#cbb6ff"
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 40

# left rail:  *  ▸ session-0 ◂
set -g status-left "#[fg=#a98bff,bg=#14101c,bold] * #[fg=#a98bff,bg=#14101c]#{@iris-tip-l}#[fg=#14101c,bg=#a98bff,bold] #{session_name} #[fg=#a98bff,bg=#14101c]#{@iris-tip-r}"

# right rail: zoom flag only
set -g status-right "#[fg=#14101c,bg=#e6a94d,bold]#{?window_zoomed_flag, ZOOM ,}#[fg=#e6a94d,bg=#14101c]"

# window list
set -g window-status-separator ""
set -g window-status-format "#[fg=#2a2140,bg=#14101c]#{@iris-rule}#[fg=#9a80d0,bg=#14101c]#{?#{m/r:^(nvim|nvim-q|nvim-remote),#{pane_current_command}},#{@iris-i-nvim},#{?#{m/r:^(vim|vi),#{pane_current_command}},#{@iris-i-vim},#{?#{m/r:^(zsh|bash|fish|ksh),#{pane_current_command}},#{@iris-i-shell},#{?#{m/r:^(git|lazygit),#{pane_current_command}},#{@iris-i-git},#{?#{m/r:^docker,#{pane_current_command}},#{@iris-i-docker},#{?#{m/r:^python,#{pane_current_command}},#{@iris-i-python},#{?#{m/r:^node,#{pane_current_command}},#{@iris-i-node},#{?#{m/r:^opencode,#{pane_current_command}},#{@iris-i-opencode},#{@iris-i-fallback}}}}}}}}}#[fg=#6a5b8f,bg=#14101c] #{window_index}#[fg=#cbb6ff,bg=#14101c]:#{window_name} #[fg=#2a2140,bg=#14101c]#{?window_activity_flag,#{@iris-dot},}"
set -g window-status-current-format "#[fg=#a98bff,bg=#14101c]#{@iris-tip-l}#[fg=#3b2b63,bg=#a98bff]#{?#{m/r:^(nvim|nvim-q|nvim-remote),#{pane_current_command}},#{@iris-i-nvim},#{?#{m/r:^(vim|vi),#{pane_current_command}},#{@iris-i-vim},#{?#{m/r:^(zsh|bash|fish|ksh),#{pane_current_command}},#{@iris-i-shell},#{?#{m/r:^(git|lazygit),#{pane_current_command}},#{@iris-i-git},#{?#{m/r:^docker,#{pane_current_command}},#{@iris-i-docker},#{?#{m/r:^python,#{pane_current_command}},#{@iris-i-python},#{?#{m/r:^node,#{pane_current_command}},#{@iris-i-node},#{?#{m/r:^opencode,#{pane_current_command}},#{@iris-i-opencode},#{@iris-i-fallback}}}}}}}}}#[fg=#14101c,bg=#a98bff,bold] #{window_index}:#{window_name} #[fg=#a98bff,bg=#14101c]#{@iris-tip-r}"

# ─────────────────────────────────────────────────────────── pane borders ───
set -g pane-border-style "fg=#2a2140"
set -g pane-active-border-style "fg=#a98bff"
set -g pane-border-status top
set -g pane-border-format "#[fg=#{?pane_active,#a98bff,#6a5b8f},bg=default] #{pane_index} "

# ────────────────────────────────────────────────────────────── sessions ────
# Auto-named sessions (0, 1, 2 ...) become session-0, session-1 ...
set-hook -g session-created "run-shell -b '$HOME/dotfiles/tmux/scripts/session-name.sh' '#{session_name}'"

# ──────────────────────────────────────────────────────────── copy mode ─────
set -g mode-keys vi
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi w send -X copy-selection-and-cancel
bind -T copy-mode-vi C-y send -X copy-pipe-and-cancel "pbcopy"

# ────────────────────────────────────────────────────────── pane movement ───
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ──────────────────────────────────────────────────────────────── splits ────
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# ──────────────────────────────────────────────────────────────── windows ────
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind Space next-layout
bind z resize-pane -Z
bind q display-panes
bind w choose-window
bind s choose-tree
bind [ swap-pane -U
bind ] swap-pane -D
bind ! break-pane
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #I? (y/n)" kill-window

# ───────────────────────────────────────────────────────────────── misc ────
bind r source-file ~/.tmux.conf \; display "Iris reloaded"
bind m set -g mouse \; display "mouse on"
bind M set -g mouse off \; display "mouse off"

# ─────────────────────────────────────────────────────────────── plugins ────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'
