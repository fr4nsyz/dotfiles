[window]
option_as_alt = "OnlyLeft"
opacity = 0.9
blur = true
decorations = "Buttonless"
decorations_theme_variant = "Dark"

  [window.dimensions]
  columns = 80
  lines = 80

  [window.padding]
  x = 16
  y = 16

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "="
mods = "Command"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "+"
mods = "Command|Shift"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "-"
mods = "Command"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "0"
mods = "Command"
action = "ResetFontSize"

[font]
size = 18

  [font.normal]
  family = "BlexMono Nerd Font"
  style = "Regular"

[colors.primary]
background = "#000000" # Example: A dark gray background color
foreground = "#FFFFFF" # Example: A light gray foreground color
