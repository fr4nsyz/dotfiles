[window]
opacity = 0.95
blur = true
decorations = "Full"
decorations_theme_variant = "Dark"

  [window.dimensions]
  columns = 80
  lines = 80

  [window.padding]
  x = 16
  y = 16

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "SpawnNewInstance"

[font]
size = 14

  [font.normal]
  family = "Hurmit Nerd Font Mono"
  style = "Regular"

[colors.primary]
background = "#000000" # Example: A dark gray background color
foreground = "#FFFFFF" # Example: A light gray foreground color
