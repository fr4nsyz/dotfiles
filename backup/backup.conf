# Sourced by backup/*.sh. Override with BACKUP_CONF=/path/to/private.conf. No secrets here.
RESTIC_LOCAL_REPO="/Volumes/Backup/restic-laptop"
RESTIC_B2_REPO="b2:CHANGE-ME-bucket:laptop"

# macOS Keychain generic-password service names (account = $USER).
KEYCHAIN_RESTIC_PASSWORD="restic-laptop"
KEYCHAIN_B2_KEY_ID="restic-b2-key-id"
KEYCHAIN_B2_APP_KEY="restic-b2-app-key"

INCLUDE_FILE="include.txt"
EXCLUDE_FILE="exclude.txt"

KEEP_DAILY=7
KEEP_WEEKLY=5
KEEP_MONTHLY=12
KEEP_YEARLY=3

CHECK_READ_SUBSET="5%"
RESTORE_SAMPLE=20
